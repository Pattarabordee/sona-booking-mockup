<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>sōna Product Video</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Playfair+Display:wght@600;700&family=Prompt:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* storyboard page for the product video: open at 1920x1080, or 1080x1920 with ?v. Recorded headless, not linked from the app. */
:root{--bg:#ECE7DE;--paper:#F8F5EF;--ink:#3B3A30;--muted:#6B6457;--olive:#7D7F66;--olive-d:#4F4E3D;--gold:#8A7F6C;--line:#D9D0C2}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai",sans-serif}
#stage{position:fixed;inset:0;display:grid;grid-template-columns:600px 1fr}
body.v #stage{grid-template-columns:1fr;grid-template-rows:500px 1fr}
#panel{overflow:hidden;background:var(--olive-d);color:var(--paper);padding:0 64px;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:2}
body.v #panel{padding:60px 64px 0;justify-content:flex-start}
#panel .logo{position:absolute;top:56px;left:64px;font:600 34px/1 Cinzel,serif;letter-spacing:.16em}
#panel .logo small{font:400 15px "IBM Plex Sans Thai";letter-spacing:.3em;opacity:.7;margin-left:12px}
body.v #panel .logo{position:static;margin-bottom:44px}
#cap{transition:opacity .35s ease,transform .35s ease}
#cap.out{opacity:0;transform:translateY(14px)}
#cap .k{font:600 19px Cinzel,serif;letter-spacing:.05em;color:#D8CDB6;margin-bottom:18px}
#cap .ti{font:600 50px/1.28 Prompt,sans-serif}
#cap .tx{font:400 25px/1.6 "IBM Plex Sans Thai";opacity:.82;margin-top:20px}
body.v #cap .ti{font-size:54px}
body.v #cap .tx{font-size:28px}
#dots{position:absolute;bottom:60px;left:64px;display:flex;gap:10px}
#dots i{width:44px;height:4px;border-radius:2px;background:#ffffff33;transition:background .4s}
#dots i.on{background:#D8CDB6}
body.v #dots{bottom:auto;top:66px;left:auto;right:64px}
#box{position:relative;overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,#F6F3ED 0%,var(--bg) 60%)}
#app{border:0;position:absolute;left:0;top:0;transform-origin:0 0}
.card{position:fixed;inset:0;z-index:5;overflow:hidden;background:var(--olive-d);color:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 9%;opacity:0;pointer-events:none;transition:opacity .6s ease}
.card.on{opacity:1}
.card .big{font:600 150px/1 Cinzel,serif;letter-spacing:.16em;margin-left:.16em}
.card .sub{font:400 30px "IBM Plex Sans Thai";letter-spacing:.5em;opacity:.7;margin:18px 0 0 .5em}
.card .rule{width:90px;height:2px;background:#D8CDB6;margin:54px 0}
.card h1{font:600 60px/1.3 Prompt,sans-serif;margin:0}
.card h2{font:500 30px Prompt,sans-serif;letter-spacing:.03em;color:#D8CDB6;margin:0 0 44px}
.card ul{list-style:none;padding:0;margin:0;display:grid;gap:26px}
.card li{font:500 44px/1.35 Prompt,sans-serif;opacity:0;transform:translateY(18px);transition:opacity .5s ease,transform .5s ease}
.card li.on{opacity:1;transform:none}
.card .url{font:500 30px "IBM Plex Sans Thai";margin-top:48px;padding:14px 34px;border:1px solid #D8CDB688;border-radius:99px}
.card .three{display:grid;gap:22px;font:600 54px/1.3 Prompt,sans-serif}
body.v .card .big{font-size:132px}
body.v .card h1{font-size:54px}
body.v .card li{font-size:42px}
body.v .card .three{font-size:46px}
body.v .card .url{font-size:26px}
.leaf{position:absolute;color:#D8CDB6;opacity:.2;pointer-events:none;animation:sway 7s ease-in-out infinite alternate}
.leaf.b{animation-delay:-3.5s}
@keyframes sway{from{rotate:-2.5deg}to{rotate:2.5deg}}
.card .leaf{width:520px;height:520px}
.card .leaf.a{left:-40px;top:-40px;transform-origin:0 0}
.card .leaf.b{right:-40px;bottom:-40px;scale:-1 -1}
#panel .leaf{width:300px;height:300px;right:-30px;bottom:-30px;scale:-1 -1;opacity:.14}
body.v #panel .leaf{width:240px;height:240px}
body.v .card .leaf{width:440px;height:440px}
.card .qr{background:var(--paper);border-radius:28px;padding:22px;margin:54px 0 30px;box-shadow:0 18px 50px #00000040}
.card .qr img{display:block;width:380px;height:380px;image-rendering:pixelated}
.card .scan{font:500 34px Prompt,sans-serif}
.card .scan + .url{margin-top:22px}
</style>
</head>
<body>
<div id="stage">
  <div id="panel">
    <div class="logo">sōna<small>HAIR WASH</small></div>
    <div id="cap" class="out"><div class="k"></div><div class="ti"></div><div class="tx"></div></div>
    <div id="dots"><i></i><i></i><i></i><i></i></div>
  </div>
  <div id="box"><iframe id="app" src="index.html?try&lean=1"></iframe></div>
</div>
<div class="card on" id="c0"><div class="big">sōna</div><div class="sub">HAIR WASH</div><div class="rule"></div><h1>ระบบจองคิวผ่าน LINE<br>และ iPad หน้าร้าน</h1></div>
<div class="card" id="c1"><h2>ทุกวันนี้ร้านเสียเวลากับ</h2><ul><li>ตอบแชทจองคิวระหว่างสระผม</li><li>ลงคิวซ้ำใน Google Calendar</li><li>เปิดดูสลิปทีละใบ แล้วพิมพ์แจ้งเจ้าของร้าน</li></ul></div>
<div class="card" id="c2"><h1>ลองจองคิวเองได้จากมือถือ</h1><div class="qr"><img src="qr.png" alt=""></div><div class="scan">สแกนเพื่อเปิด mockup</div><div class="url">pattarabordee.github.io/sona-booking-mockup</div></div>
<script>
// same leaf sprig as the app's phone header
const LEAF = cls => `<svg class="leaf ${cls}" viewBox="0 0 80 80" fill="currentColor" aria-hidden="true"><path d="M2 4C24 16 44 34 64 76" stroke="currentColor" stroke-width="1.5" fill="none"/>${[[12,9],[22,16],[31,25],[40,35],[48,46],[55,57],[61,68]].map(([x, y], i) => { const s = i % 2 ? 1 : -1, cx = x + 7 * s, cy = y - 5 * s; return `<ellipse cx="${cx}" cy="${cy}" rx="7.5" ry="3.2" transform="rotate(${s > 0 ? -12 : 72} ${cx} ${cy})"/>`; }).join('')}</svg>`;
document.querySelectorAll('.card').forEach(c => c.insertAdjacentHTML('afterbegin', LEAF('a') + LEAF('b')));
document.querySelector('#panel').insertAdjacentHTML('afterbegin', LEAF('b'));
const V = new URLSearchParams(location.search).has('v');
document.body.classList.toggle('v', V);
const $ = s => document.querySelector(s), hold = ms => new Promise(r => setTimeout(r, ms));
const f = $('#app'), box = $('#box');
// the app keeps 190px free at the bottom for its own caption; the frame is that much taller than the visible box so targets sit centred
function size() { const k = V ? box.clientWidth / 1280 : 1; f.style.transform = `scale(${k})`; f.style.width = box.clientWidth / k + 'px'; f.style.height = box.clientHeight / k + 170 + 'px'; }
size();
let W, d;
const ZK = V ? 1.45 : 1; // the tall frame has room for a bigger phone; the app still caps the zoom to what fits
const get = t => typeof t === 'string' ? d.querySelector(t) : t();
const mine = sel => () => d.querySelector(sel.replace('ID', W.eval('S.c.last.id')));
const spotOff = () => { d.getElementById('dSpot').style.opacity = 0; };
const DEV = { cust: '.phone', kiosk: '.tablet', owner: '.kpis' };
async function cap(k, ti, tx = '') { const c = $('#cap'); c.classList.add('out'); await hold(360); c.children[0].textContent = k; c.children[1].innerHTML = ti; c.children[2].innerHTML = tx; c.classList.remove('out'); }
async function view(v, n) { spotOff(); d.querySelector(`[data-v="${v}"]`).click(); await hold(120); W.dZoom(d.querySelector(DEV[v]), ZK); document.querySelectorAll('#dots i').forEach((e, i) => e.classList.toggle('on', i <= n)); await hold(900); }
async function look(t, z) { spotOff(); await hold(200); W.dZoom(get(t), z * ZK); await hold(720); W.dPlace(get(t)); await hold(500); }
// zt: zoom on a wider element (the whole queue row) while the frame and fingertip land on the button
async function tap(t, z, zt = t) { spotOff(); await hold(200); W.dZoom(get(zt), z * ZK); await hold(720); W.dPlace(get(t)); await hold(500); await W.dTap(get(t), () => get(t).click()); spotOff(); await hold(650); }
async function card(id, on) { $(id).classList.toggle('on', on); await hold(650); }

async function run() {
  W = f.contentWindow; d = W.document;
  d.head.insertAdjacentHTML('beforeend', '<style>.nav,#dCap,#dRotate,.note{display:none!important}body{background:transparent!important}html{overflow:hidden}</style>');
  d.body.insertAdjacentHTML('beforeend', '<div id="dBlock"></div><div id="dSpot"></div><div id="dRing"></div><div id="dTouch"></div>');
  d.querySelector('main').classList.add('demo');
  await document.fonts.ready; await d.fonts.ready;
  d.querySelector('[data-v="cust"]').click(); W.dZoom(d.querySelector('.phone'), ZK);
  window.__t0 = Date.now();
  await hold(3400);
  await card('#c1', true); $('#c0').classList.remove('on'); // the next card fades in on top first, so the app never shows through
  for (const li of document.querySelectorAll('#c1 li')) { li.classList.add('on'); await hold(1500); }
  await hold(900);
  cap('01 · ลูกค้า', 'จองเองใน LINE<br>จบใน 3 แตะ', 'ไม่ต้องโหลดแอป ไม่ต้องสมัครสมาชิก');
  await view('cust', 0); await card('#c1', false); await hold(1500);
  await tap('[data-act="c-open"]', 1.25);
  cap('01 · ลูกค้า', 'ระบบจำครั้งก่อนไว้ให้', 'สาขา บริการ และเบอร์โทร เติมไว้แล้ว');
  await look('.prev', 1.35); await hold(2300);
  cap('01 · ลูกค้า', 'เลือกได้เฉพาะเวลาที่ยังว่าง', 'เวลาที่ช่างเต็มแล้วจะกดไม่ได้');
  await tap('.slot[data-t="1020"]', 1.4); await hold(1100);
  await tap('[data-act="c-book"]', 1.35);
  cap('01 · ลูกค้า', 'ได้รหัสจองทันที', 'ยกเลิกเองได้ก่อนนัด 2 ชม.');
  await look('.ticket', 1.3); await hold(2600);

  cap('02 · หน้าร้าน', 'คิวใหม่ขึ้นที่ iPad ทันที', 'ไม่ต้องตอบแชท ไม่ต้องลงปฏิทินเอง');
  await view('kiosk', 1); await hold(900);
  await look(() => mine('[data-act="l-go"][data-id="ID"]')().closest('.q'), 1.25); await hold(2200);
  cap('02 · หน้าร้าน', 'ช่างแตะชื่อตัวเอง', 'แตะครั้งเดียว คิวเปลี่ยนเป็นกำลังทำ');
  await tap(mine('[data-act="l-go"][data-id="ID"][data-s="2"]'), 1.25, () => mine('[data-act="l-go"][data-id="ID"]')().closest('.q')); await hold(1700);
  cap('02 · หน้าร้าน', 'ทำเสร็จ แตะรับเงิน<br>บนแถวเดียวกัน', 'เงินสดปิดคิวทันที เงินโอนรอตรวจสลิป');
  await tap(mine('[data-act="p-method"][data-m="transfer"][data-id="ID"]'), 1.25, () => mine('[data-act="p-method"][data-m="transfer"][data-id="ID"]')().closest('.q')); await hold(2000);

  cap('03 · ชำระเงิน', 'ลูกค้าส่งสลิปในแชท', 'ระบบตรวจยอดเงิน บัญชีร้าน และสลิปซ้ำ');
  d.querySelector('[data-v="cust"]').click(); d.querySelector('[data-act="c-chat"]')?.click();
  await view('cust', 2); await hold(700);
  await tap(mine('[data-act="c-slip"][data-id="ID"]'), 1.35);
  cap('03 · ชำระเงิน', 'ตรวจผ่าน ปิดคิวอัตโนมัติ', 'พนักงานไม่ต้องเปิดดูสลิปเอง');
  await look(() => [...d.querySelectorAll('#custApp .bub.flex')].pop(), 1.35); await hold(2700);

  cap('04 · เจ้าของร้าน', 'เห็นยอดขายทันที', 'แยกเงินสด เงินโอน สาขา และรายช่าง');
  await view('owner', 3); await hold(500);
  await look('.kpis', 1.9); await hold(3000);
  cap('04 · เจ้าของร้าน', 'ทุกการกดมีบันทึก', 'ดูย้อนหลังได้ว่าใครกดอะไร เวลาไหน');
  await look(() => [...d.querySelectorAll('#ownerApp > .card')].pop(), 1.6); await hold(3200);

  await card('#c2', true); await hold(5200);
  window.__done = Date.now();
}
f.addEventListener('load', () => run().catch(e => { console.error(e); window.__err = String(e); window.__done = Date.now(); }));
</script>
</body>
</html>
